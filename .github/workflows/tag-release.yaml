name: Tag and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check if tag exists
        id: check
        run: |
          VERSION=v$(cat VERSION)
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION=v$(cat VERSION)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"

  cross-compile:
    needs: tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binary
        run: |
          VERSION=v$(cat VERSION)
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags "-s -w" -trimpath -o encodekit-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} ./cmd/encodekit
          tar -czf encodekit-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz encodekit-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: encodekit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: encodekit-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  release:
    needs: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Generate checksums
        run: |
          find . -name "*.tar.gz" -exec sha256sum {} \; > checksums.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v$(cat VERSION)
          name: encodekit v$(cat VERSION)
          files: |
            *.tar.gz
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
